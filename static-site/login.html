<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMBC Stormwater GIS — Sign In</title>
  <link rel="stylesheet" href="login.css">
  <!-- Public Supabase URL and publishable key only. Must load before login.js. -->
  <script src="supabase-config.js"></script>
  <script type="module" src="login.js"></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="sign-in-title">
      <header class="login-header">
        <div class="logo-box">
          <img src="assets/stormwater-logo.png" alt="UMBC Stormwater GIS logo" width="52" height="52">
        </div>
        <div>
          <h1>UMBC</h1>
          <p>STORMWATER GIS</p>
        </div>
      </header>

      <div class="login-content">
        <h2 id="sign-in-title">Sign in</h2>
        <p class="subtitle">Sign in with your UMBC Google account to save inspections. The campus map then asks for your UMBC ArcGIS sign-in.</p>

        <p id="login-message" class="login-message" role="status" aria-live="polite"></p>
        <button id="google-sign-in" type="button" disabled>Sign in with Google</button>

        <div id="signed-in" class="signed-in" hidden>
          <p>Signed in as <strong id="signed-in-email"></strong></p>
          <button id="continue" type="button">Continue</button>
          <button id="sign-out" class="btn-secondary" type="button">Sign out</button>
        </div>

        <p class="login-help">Only @umbc.edu Google accounts can sign in. The dashboard stays hidden until the ArcGIS sign-in also succeeds.</p>
      </div>
    </section>
  </main>
</body>
</html>
